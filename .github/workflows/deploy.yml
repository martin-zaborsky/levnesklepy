name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout kód
        uses: actions/checkout@v4
      
      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Inštalácia balíčkov
        run: npm install
        
      - name: Zostavenie (Build)
        run: npm run build
        
      - name: Nahratie súborov
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Nasadenie na Pages
        id: deployment
        uses: actions/deploy-pages@v4
